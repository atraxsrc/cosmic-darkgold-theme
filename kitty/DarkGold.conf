# DarkGold for kitty, part of cosmic-darkgold-theme (MIT).
# Colours follow the COSMIC Terminal scheme (cosmic-term/).
#
# Install: ./kitty/install.sh puts this in ~/.config/kitty/themes/, then in
# ~/.config/kitty/kitty.conf:
#   include themes/DarkGold.conf

foreground              #EFEBDC
background              #1B1B1B
selection_foreground    none
selection_background    #4E4E49

cursor                  #EFEBDC
cursor_text_color       #1B1B1B

url_color               #A99B7A
url_style               curly

active_border_color     #C0AF7F
inactive_border_color   #817F68
bell_border_color       #C0AF7F

active_tab_foreground   #1B1B1B
active_tab_background   #C0AF7F
inactive_tab_foreground #A8A59B
inactive_tab_background #2A2A29
tab_bar_background      #1B1B1B

mark1_foreground        #1B1B1B
mark1_background        #A99B7A
mark2_foreground        #1B1B1B
mark2_background        #A99B7A
mark3_foreground        #1B1B1B
mark3_background        #C0AF7F

