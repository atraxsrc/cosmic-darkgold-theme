# DarkGold colour scheme for qt5ct / qt6ct, part of cosmic-darkgold-theme (MIT).
# The rice's window colour for windows, its containers for buttons and
# tooltips, its text colour, the accent as highlight with the button text
# colour on it, dim placeholders.
#
# Install: ./qt/install.sh puts this in ~/.config/qt5ct/colors/ and
# ~/.config/qt6ct/colors/. Then in qt5ct / qt6ct: Appearance -> Color scheme
# -> DarkGold, Palette: Custom, Apply. Qt apps need QT_QPA_PLATFORMTHEME=qt5ct
# (or qt6ct) in the environment to read it.
#
# Roles, in order: WindowText, Button, Light, Midlight, Dark, Mid, Text,
# BrightText, ButtonText, Base, Window, Shadow, Highlight, HighlightedText,
# Link, LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText,
# PlaceholderText
[ColorScheme]
active_colors=#efebdc, #2a2a29, #817f68, #4e4e49, #1b1b1b, #3c3c39, #efebdc, #efebdc, #efebdc, #1b1b1b, #1b1b1b, #1b1b1b, #c0af7f, #1b1b1b, #c0af7f, #c0af7f, #2a2a29, #1b1b1b, #2a2a29, #efebdc, #6d6d6d
disabled_colors=#6d6d6d, #2a2a29, #817f68, #4e4e49, #1b1b1b, #3c3c39, #6d6d6d, #a8a59b, #6d6d6d, #1b1b1b, #1b1b1b, #1b1b1b, #817f68, #a8a59b, #6d6d6d, #6d6d6d, #2a2a29, #1b1b1b, #2a2a29, #efebdc, #817f68
inactive_colors=#efebdc, #2a2a29, #817f68, #4e4e49, #1b1b1b, #3c3c39, #efebdc, #efebdc, #efebdc, #1b1b1b, #1b1b1b, #1b1b1b, #c0af7f, #1b1b1b, #c0af7f, #c0af7f, #2a2a29, #1b1b1b, #2a2a29, #efebdc, #6d6d6d
